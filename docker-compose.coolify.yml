# Fresher Sprint on Coolify.
#
# Coolify: New Resource -> Docker Compose (from this repo) ->
#   Docker Compose Location: /docker-compose.coolify.yml
# Then, in the resource:
#   1. Domains: set the `nginx` service domain to https://sprint-quant.tech-iitb.org
#      (Coolify routes it to container port 80; enable websockets is automatic).
#   2. Environment Variables: fill POSTGRES_PASSWORD, JWT_SECRET (>= 32 chars),
#      ADMIN_PASSWORD (>= 12 chars) and ITC_SSO_PROJECT_ID. Mark them as runtime
#      variables; NEXT_PUBLIC_* are fixed to "relative" below, so web needs no
#      build variables.
#   3. Deploy. `migrate` creates the schema and the admin account, then exits.
#
# No ports are published: Coolify's proxy (Traefik) is the only way in, and nginx
# serves / (web), /api/ (API) and /ws (gateway) from one origin.

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-qtp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qtp}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qtp}
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - work_mem=8MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 1gb
    volumes:
      - qtp-pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created.
      - ./infra/postgres/event-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - qtp-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    environment:
      <<: *node-env
      # Event databases get only the admin account: no demo traders or challenges.
      SEED_DEMO_DATA: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # One-shot job: it is meant to exit, so Coolify must not treat that as a failure.
    exclude_from_hc: true

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: api
    restart: unless-stopped
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment:
      <<: *node-env
      API_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-43200}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ITC_SSO_PROJECT_ID: ${ITC_SSO_PROJECT_ID:-}
      ITC_SSO_BASE_URL: ${ITC_SSO_BASE_URL:-https://sso.tech-iitb.org}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    environment:
      <<: *node-env
      GATEWAY_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: engine
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      <<: *node-env
      ENGINE_TICK_MS: ${ENGINE_TICK_MS:-1000}
      ENGINE_MINUTE_MS: ${ENGINE_MINUTE_MS:-60000}
      ENGINE_PROFILE: ${ENGINE_PROFILE:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scoring:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: scoring
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      <<: *node-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: relative
        NEXT_PUBLIC_WS_URL: relative
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api

  # Public entry. Give THIS service the domain in Coolify (container port 80).
  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./infra/nginx/coolify/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/event:/etc/nginx/event:ro
    depends_on:
      - web
      - api
      - gateway

volumes:
  qtp-pgdata:
  qtp-redisdata:
