# Fresher Sprint event stack: the whole platform on one host laptop.
#
#   cp .env.example .env.event   (then fill in the secrets)
#   docker compose -f docker-compose.event.yml --env-file .env.event up -d --build
#   # with the Cloudflare tunnel:
#   docker compose -f docker-compose.event.yml --env-file .env.event --profile tunnel up -d
#
# Entry points (one build serves both — the web app uses relative URLs):
#   LAN:    http://<host-lan-ip>/            (nginx :80)
#   Tunnel: https://<your-domain>/           (Cloudflare -> cloudflared -> nginx)

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER:-qtp}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qtp}
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qtp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qtp}
    # Sized for an ~11 GB Docker VM shared with every other service.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - work_mem=8MB
      - -c
      - wal_compression=on
      - -c
      - max_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - shared_preload_libraries=pg_stat_statements
    shm_size: 1gb
    volumes:
      - qtp-event-pgdata:/var/lib/postgresql/data
      # Runs only when the data volume is first created.
      - ./infra/postgres/event-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qtp}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - qtp-event-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.migrate
    environment:
      <<: *node-env
      # Event databases get only the admin account: no demo traders or challenges.
      SEED_DEMO_DATA: "false"
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: api
    restart: unless-stopped
    # Stateless (Redis + Postgres hold all state); nginx spreads requests
    # across replicas via Docker DNS.
    deploy:
      replicas: ${API_REPLICAS:-4}
    environment:
      <<: *node-env
      API_PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-43200}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  gateway:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: gateway
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    deploy:
      replicas: ${GATEWAY_REPLICAS:-2}
    environment:
      <<: *node-env
      GATEWAY_PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  engine:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: engine
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      <<: *node-env
      ENGINE_TICK_MS: ${ENGINE_TICK_MS:-1000}
      ENGINE_MINUTE_MS: ${ENGINE_MINUTE_MS:-60000}
      ENGINE_PROFILE: ${ENGINE_PROFILE:-0}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  scoring:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.service
      args:
        SERVICE: scoring
    restart: unless-stopped
    command: ["node", "dist/index.js"]
    environment:
      <<: *node-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: relative
        NEXT_PUBLIC_WS_URL: relative
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      - api
    networks: [internal]

  nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/event/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/event:/etc/nginx/event:ro
    depends_on:
      - web
      - api
      - gateway
    networks: [internal]

  # Named Cloudflare Tunnel. Create the tunnel in the Cloudflare dashboard,
  # route its public hostname to http://nginx:8081, and put its token in
  # CLOUDFLARE_TUNNEL_TOKEN. Started only with `--profile tunnel`.
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  qtp-event-pgdata:
  qtp-event-redisdata:
