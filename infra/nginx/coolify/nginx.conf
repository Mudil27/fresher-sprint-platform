# Fresher Sprint proxy for Coolify (docker-compose.coolify.yml).
#   :80  the only entry. Coolify's Traefik terminates TLS and forwards here.
# Traefik appends the real peer to X-Forwarded-For, so the LAST entry is the
# client address and cannot be spoofed by a client-supplied header. It becomes
# $client_ip, which the API rate-limits on.
worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  access_log off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Docker DNS: pick up scaled or restarted replicas without a reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Trust only the proxy hop(s) in front of us (private ranges).
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;

  upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 32;
  }
  upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
  }
  upstream gateway {
    zone gateway 64k;
    server gateway:8080 resolve;
  }

  server {
    listen 80 default_server;
    server_name _;
    set $client_ip $remote_addr;
    include /etc/nginx/event/locations.conf;
  }
}
