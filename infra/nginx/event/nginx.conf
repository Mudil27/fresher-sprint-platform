# Fresher Sprint event proxy (docker-compose.event.yml).
#   :80   LAN entry, published on the host. Client IP = TCP peer.
#   :8081 Tunnel entry, reachable only inside the compose network by
#         cloudflared. Client IP = Cloudflare's CF-Connecting-IP.
# Both overwrite X-Real-IP / X-Forwarded-For so a client can never spoof the
# address the API rate-limits on.
worker_processes auto;

events {
  worker_connections 8192;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  # Per-request access logs to Docker stdout cost CPU at event load.
  access_log off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json text/plain image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Docker DNS: re-resolve service names so scaled or restarted replicas
  # (new container IPs) are picked up without reloading nginx.
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream web {
    zone web 64k;
    server web:3000 resolve;
    keepalive 32;
  }
  upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 64;
  }
  upstream gateway {
    zone gateway 64k;
    server gateway:8080 resolve;
  }

  server {
    listen 80 default_server;
    server_name _;
    set $client_ip $remote_addr;
    include /etc/nginx/event/locations.conf;
  }

  server {
    listen 8081;
    server_name _;
    set $client_ip $http_cf_connecting_ip;
    if ($client_ip = "") {
      set $client_ip $remote_addr;
    }
    include /etc/nginx/event/locations.conf;
  }
}
